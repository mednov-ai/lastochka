  Project: Lastochka, a children's gymnastics studio in Belgorod.
  Read AGENTS.md for confirmed scope and distinguish proposals from user decisions.
  Current requirements live in openspec/specs; completed changes are historical archives.
  Read docs/project-status.md for delivered versions and acceptance limits.
  One React 19/TypeScript frontend covers landing, guest enquiries and admin routes.
  Backend uses Kotlin, Java 25 and stable Spring Boot 4; the database is PostgreSQL.
  Build locally and deploy frontend and backend independently as separate versioned images.
  The backend JAR contains no frontend; frontend has its own Node SSR runtime.
  Start with Docker Compose and one public reverse-proxy origin; migrate to Kubernetes later.
  The initial server is 139.100.236.101 and public URL is https://play-and-say.ru/lastochka/.
  Use /lastochka as the frontend basename and backend context path; public API is
  /lastochka/api/v1. Preserve existing Play&Say routes and use distinct scoped cookies.
  Preview WebAuthn origin is https://play-and-say.ru and RP ID is play-and-say.ru.
  Plan migration to a future working server; a changed RP domain needs a separate passkey plan.
  Use internal Gradle modules, explicitly separate scheduling and payments.
  The small server runs ready-made images; no builds are performed there.
  Landing content is structured and separate from UI, ready for a future editor.
  Track openspec in Git; ignore info and local build outputs, but track runtime assets.
  Backend OpenAPI drives generated frontend transport types and typed API access.
  Guests submit enquiries without an account, booking or place reservation.
  Predefined ADMIN logins use preserved passwords and optional WebAuthn keys.
  Baseline operator-only provisioning/reset is superseded by the active user-password-lifecycle delta after its implementation.
  Session access checks current admission, auth_version and external access generation.
  Landing, assets and published schedule are public without global Basic Auth.
  Public CTA leads to the guest form with a working no-JavaScript server action.
  Enquiry and outgoing Telegram event are committed atomically with durable retries.
  Missing bot configuration leaves requests saved and delivery pending.
  Retired email/booking/attendance APIs return 410; public MailHog returns 404.
  MailHog/runtime mail archive and seven retired tables are deleted; preserve private tested backups only.
  Do not resume SMTP/RuSender, mail services or old workers.
  Payment preparation stores DRAFT/RUB/integer kopecks; issuing real links is disabled.
  Future deployments must preserve current enquiries, queue and payment drafts.
  Rollback requires concept-aware PASSWORD_LIFECYCLE_V1 images supporting V14; backend0.10.0 and earlier cannot enforce mandatory password change.
  Disaster restore requires a new external ADMIN_ACCESS_GENERATION outside the database.
  The first version has one trainer and one room.
  Multiple independent administrators may manage the same schedule.
  The landing page follows the air concept referenced in AGENTS.md and info assets.
