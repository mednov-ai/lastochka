name: lastochka-local
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: lastochka
      POSTGRES_USER: lastochka
      POSTGRES_PASSWORD: local-lastochka
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastochka -d lastochka"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
