# Relays encrypted connections of the backend to the VK API only.
# TLS is not terminated here: the backend verifies the certificate of api.vk.com.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
stream {
  # Docker DNS would return this relay for its own alias, so the resolvers are explicit (1.1.1.1 is unreachable from the VPS).
  resolver 77.88.8.8 8.8.8.8 valid=60s ipv6=off;
  resolver_timeout 5s;
  # Any other or missing name leads to a closed local port.
  map $ssl_preread_server_name $vk_upstream {
    api.vk.com api.vk.com:443;
    default 127.0.0.1:1;
  }
  server {
    listen 443;
    ssl_preread on;
    preread_timeout 5s;
    proxy_connect_timeout 5s;
    proxy_timeout 30s;
    proxy_pass $vk_upstream;
  }
}
