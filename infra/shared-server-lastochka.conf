# Insert ONLY these locations into the existing HTTPS play-and-say.ru server.
# Preserve its other locations, certificates, TLS settings, ACME and root upstream.
location = /lastochka {
    absolute_redirect off;
    return 308 /lastochka/$is_args$args;
}
location = /lastochka/api/v1/public/alfa-test/callback {
    # Never log the bank's callback query, signature or identifiers.
    access_log off;
    error_log /dev/null crit;
    auth_basic off;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
location = /lastochka/payments/test/return {
    # The bank return URL may contain a sensitive order identifier.
    access_log off;
    error_log /dev/null crit;
    auth_basic off;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
location ^~ /lastochka/ {
    # Public landing/auth forms. Private APIs enforce session, role and ownership.
    auth_basic off;
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}
