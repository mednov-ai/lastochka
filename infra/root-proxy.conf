worker_processes 1;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  map $http_x_forwarded_proto $external_proto { default $scheme; https https; http http; }
  map $uri $legacy_target {
    default /;
    ~^/lastochka/(.*)$ /$1;
  }
  # Old React Router tabs cannot decode route data from a different basename.
  # Ask them to reload the target document instead of interpreting new data.
  map "$request_method:$uri" $legacy_document {
    default "";
    ~^GET:/lastochka/api/ "";
    ~^GET:/lastochka/assets/ "";
    ~^GET:/lastochka/(.*/)?_\.data$ /$1;
    ~^GET:/lastochka/(.*)\.data$ /$1;
  }
  server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    # The external Nginx checks the gate before proxying these redirects.
    location = /lastochka { return 308 /$is_args$args; }
    # Legacy bank URLs may carry signatures and identifiers in the query.
    location = /lastochka/api/v1/public/alfa-test/callback {
      access_log off;
      error_log /dev/null crit;
      return 308 /api/v1/public/alfa-test/callback$is_args$args;
    }
    location = /lastochka/payments/test/return {
      access_log off;
      error_log /dev/null crit;
      return 308 /payments/test/return$is_args$args;
    }
    location ^~ /lastochka/ {
      if ($legacy_document != "") {
        add_header X-Remix-Redirect $legacy_document$is_args$args always;
        add_header X-Remix-Status 302 always;
        add_header X-Remix-Reload-Document true always;
        return 204;
      }
      return 308 $legacy_target$is_args$args;
    }
    location = /mail_hog_test { return 404; }
    location ^~ /mail_hog_test/ { return 404; }
    location = /api/v1/public/alfa-test/callback {
      access_log off;
      error_log /dev/null crit;
      proxy_pass http://backend:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto $external_proto;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /payments/test/return {
      access_log off;
      error_log /dev/null crit;
      proxy_pass http://frontend:3000;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto $external_proto;
    }
    location ^~ /api/ {
      proxy_pass http://backend:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto $external_proto;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto $external_proto;
    }
  }
}
