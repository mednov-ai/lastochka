worker_processes 1;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  map $http_x_forwarded_proto $external_proto { default $scheme; https https; http http; }
  server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    location = /lastochka { return 308 /lastochka/$is_args$args; }
    location = /lastochka/mail_hog_test { return 404; }
    location ^~ /lastochka/mail_hog_test/ { return 404; }
    location ^~ /lastochka/api/ {
      proxy_pass http://backend:8080;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto $external_proto;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /lastochka/ {
      proxy_pass http://frontend:3000;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Port "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Proto $external_proto;
    }
    location / { return 404; }
  }
}
