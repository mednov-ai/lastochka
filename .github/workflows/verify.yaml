name: Verify Lastochka
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:55436/lastochka_concept
      DATABASE_USER: lastochka
      DATABASE_PASSWORD: concept-local-only
      TEST_DATABASE_CONTAINER: lastochka-concept-postgres
      TEST_APP_URL: http://localhost:5173/lastochka
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: 'backend/**/*.gradle.kts'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Isolated local infrastructure
        run: |
          docker run -d --name lastochka-concept-postgres -e POSTGRES_DB=lastochka_concept -e POSTGRES_USER=lastochka -e POSTGRES_PASSWORD=concept-local-only -p 127.0.0.1:55436:5432 postgres:17.6-alpine
          for attempt in $(seq 1 60); do docker exec lastochka-concept-postgres pg_isready -U lastochka -d lastochka_concept && break; sleep 1; done
      - name: Backend tests and independent JAR
        run: backend/gradlew -p backend :app:test :app:bootJar
      - name: Start backend
        run: |
          LASTOCHKA_ADMIN_LOGIN=fixture-admin LASTOCHKA_ADMIN_NAME=Fixture LASTOCHKA_ADMIN_PASSWORD=Fixture-pass-123 java -jar backend/app/build/libs/app-0.1.0.jar --lastochka.admin.create=true --server.port=0 --lastochka.workers.enabled=false
          python3 scripts/local-backend.py start
      - name: Export contract and generate frontend client
        run: |
          python3 scripts/export-openapi.py
          npm --prefix frontend ci --include=dev
          npm --prefix frontend run api:generate
          git diff --exit-code -- api/openapi.json frontend/app/api/schema.d.ts
      - name: Russian user-facing text and terminology
        run: |
          npm --prefix frontend run check:ui-language
          npm --prefix frontend run test:ui-language
      - name: Frontend types and independent build
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run build
      - name: Browser acceptance
        run: |
          cd frontend
          npx playwright install --with-deps chromium webkit
          npm run dev > ../runtime-data/frontend.log 2>&1 &
          for attempt in $(seq 1 60); do curl --fail --silent http://localhost:5173/lastochka/ > /dev/null && break; sleep 1; done
          npx playwright test -c playwright.concept.config.ts
      - name: Whitespace and no ignored source materials
        run: |
          git diff --check
          test -z "$(git ls-files info)"
          test -n "$(git ls-files openspec)"
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-results
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
